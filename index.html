<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="icon"
            type="image/png"
            href="/favicon/favicon-96x96.png"
            sizes="96x96"
        />
        <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
        <link rel="shortcut icon" href="/favicon/favicon.ico" />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="/favicon/apple-touch-icon.png"
        />
        <link rel="manifest" href="/favicon/site.webmanifest" />
        <link rel="preconnect" href="https://fonts.bunny.net" />
        <link
            href="https://fonts.bunny.net/css?family=poppins:400,500,600,700"
            rel="stylesheet"
        />
        <title>MrLoyd</title>
        <script>
            const appearance = localStorage.getItem('appearance') || 'light';
            if (
                appearance === 'dark' ||
                (appearance === 'system' &&
                    window.matchMedia('(prefers-color-scheme: dark)').matches)
            ) {
                document.documentElement.classList.add('dark');
            }
            document.documentElement.setAttribute(
                'data-theme',
                localStorage.getItem('color-theme') || 'teal',
            );
        </script>
    </head>
    <body class="font-sans antialiased">
        <div id="app"></div>
        <script type="module" src="/resources/js/static-app.tsx"></script>
    </body>
</html>
