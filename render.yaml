services:
  - type: web
    name: mrloyd-jl-portfolio
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /up
    envVars:
      - key: PORT
        value: '80'
      - key: APP_NAME
        value: MrLoyd
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: 'false'
      - key: APP_KEY_BASE64
        generateValue: true
      - key: PORTFOLIO_PUBLIC_ONLY
        value: 'true'
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: sqlite
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
